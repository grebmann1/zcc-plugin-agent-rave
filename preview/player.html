<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rave · Spotify deck refinement</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090910;color:#f5f3fa;font:13px/1.5 Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #c9ff76;outline-offset:4px}#review{background:#eeeaf5;color:#342840;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px}#review strong{margin-right:auto}#review button{border:1px solid #beafcb;background:transparent;border-radius:6px;padding:6px 12px;color:#342840}#review button[aria-pressed=true]{background:#342840;color:white}#frame{width:100%;margin:auto;transition:width .2s;container-type:inline-size}.room{height:310px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#4d216136,transparent 55%),linear-gradient(140deg,#0e0a1a,#11101c 60%,#080b11);border-bottom:1px solid #393044}.room:after{content:'';position:absolute;inset:40% -50% -70%;background:repeating-linear-gradient(0deg,transparent 0 48px,#c064ff13 49px 50px),repeating-linear-gradient(90deg,transparent 0 80px,#c064ff13 81px 82px);transform:perspective(240px) rotateX(55deg)}.room>div{position:absolute;left:30px;top:30px}.room small{color:#b6a4c7;letter-spacing:2px;font-size:9px}.room h1{font-size:25px;font-weight:500;letter-spacing:-.8px;margin:8px 0}.room p{color:#9d8faa;font-size:12px}.neon{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font-size:70px;letter-spacing:10px;font-weight:200;color:#eab3ff;text-shadow:0 0 30px #bf64ff66;opacity:.4}
.deck{position:relative;padding:22px 30px;background:radial-gradient(ellipse at 5% 100%,#9a62db12,transparent 38%),linear-gradient(110deg,#17131f,#111119 65%);box-shadow:0 -16px 50px #0003}.deck:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,#c9ff7644,#b56aff55 35%,#ffffff0d 70%)}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,1.25fr) minmax(0,1fr);align-items:center;gap:28px}.identity{display:flex;gap:16px;align-items:center;min-width:0}.art{position:relative;width:64px;height:64px;flex-shrink:0;display:grid;place-items:center;border:1px solid #b58cd52b;border-radius:14px;background:radial-gradient(ellipse at 15% 0,#79539955,transparent 70%),#211a2b;box-shadow:inset 0 1px #ffffff0a,0 4px 16px #0003}.vinyl{width:47px;height:47px;border-radius:50%;border:1px solid #d7b6f740;background:repeating-radial-gradient(circle,#13101c 0 3px,#35263f 4px,#17121f 5px);display:grid;place-items:center}.vinyl:before{content:'';width:15px;height:15px;border-radius:50%;background:#c9ff76;box-shadow:0 0 15px #c9ff7633}.vinyl:after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:#25321c}.meta{min-width:0}.label{display:flex;align-items:center;gap:6px;color:#bddaa8;font-size:9px;letter-spacing:1.8px;font-weight:650}.label svg{width:13px;height:13px;color:#c9ff76}.title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:600;letter-spacing:-.3px;margin:3px 0 1px}.artist{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#b7adc3}.playback{width:100%;max-width:480px;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:10px}.transport{display:flex;gap:21px;align-items:center}.icon{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;border:1px solid transparent;border-radius:50%;background:transparent;color:#bdb4cb;padding:8px}.icon:hover{background:#ffffff0a;color:#fff}.icon svg{width:17px;height:17px}.play{width:42px;height:42px;color:#18210e;background:#c9ff76;box-shadow:0 0 20px #c9ff7612;transition:transform .15s,background .15s}.play:hover{transform:scale(1.05);background:#d7ff9c;color:#18210e}.timeline{display:flex;align-items:center;gap:12px;width:100%;color:#a99db8;font-size:9px;font-variant-numeric:tabular-nums}.timeline>span{min-width:26px}.timeline>span:last-child{text-align:right}.rail{height:3px;border-radius:10px;flex:1;background:#ffffff14;overflow:hidden}.rail i{display:block;width:27%;height:100%;background:linear-gradient(90deg,#99c957,#d5ff99);border-radius:10px}.actions{display:flex;align-items:center;gap:14px;justify-content:flex-end;min-width:0}.choose{display:flex;align-items:center;gap:9px;background:#ffffff05;border:1px solid #d1b6ed30;color:#e1d8ec;border-radius:9px;padding:10px 14px;font-size:11px;white-space:nowrap}.choose:hover{background:#ffffff0a;border-color:#a786c666}.choose svg{width:16px;height:16px;color:#c9ff76}.disconnect{border-left:1px solid #ffffff12;border-radius:0;width:40px;padding-left:15px;color:#8d809d}.connection{display:flex;align-items:center;gap:6px;color:#988da6;font-size:10px;white-space:nowrap}.connection i{width:4px;height:4px;background:#c9ff76;border-radius:50%}.picker{position:absolute;right:30px;bottom:calc(100% + 12px);background:#21172c;border:1px solid #604773;border-radius:12px;padding:18px;display:flex;gap:10px;align-items:end;box-shadow:0 10px 40px #0007;width:min(480px,calc(100% - 40px));z-index:5}.picker label{flex:1;font-size:11px;color:#c7b2da}.picker input{display:block;background:#110c19;border:1px solid #5d456c;border-radius:6px;color:white;padding:10px;width:100%;margin-top:8px}.picker button{background:#c9ff76;border:0;padding:10px 12px;border-radius:6px;color:#18210e}.picker[hidden]{display:none}.note{padding:25px 30px;color:#91839e;font-size:12px}.old .deck{padding:18px 27px}.old .layout{display:flex;gap:20px}.old .identity{width:440px;flex-shrink:0}.old .art{width:49px;height:49px;background:none;border:0}.old .meta .title{font-size:13px}.old .meta .artist{font-size:10px}.old .playback{flex-direction:row;max-width:340px;gap:20px}.old .transport{gap:6px}.old .play{width:38px;height:38px;background:#e5d9f0}.old .timeline{max-width:230px}.old .connection{display:none}.old .actions{justify-content:flex-start}.old .disconnect{border:0}.old .choose{border-radius:6px}.old .deck:before{display:none}.old .rail i{background:#188e10}.old .identity{gap:20px}
@container(max-width:1050px){.layout{grid-template-columns:minmax(0,1fr) auto;gap:18px 24px}.playback{grid-column:1/-1;grid-row:2;max-width:620px;flex-direction:row;gap:26px}.connection{display:none}.old .identity{width:220px}.old .playback{grid-row:auto}.old .timeline{display:none}}@container(max-width:600px){.deck{padding:18px}.layout{gap:18px 12px}.identity{gap:11px}.art{width:52px;height:52px;border-radius:11px}.vinyl{width:39px;height:39px}.label{font-size:7px;letter-spacing:1.3px}.title{font-size:14px}.artist{font-size:11px}.choose{padding:9px;gap:7px;font-size:10px}.actions{gap:7px}.disconnect{padding:7px;width:28px;border:0}.playback{gap:18px}.transport{gap:12px}.play{width:38px;height:38px}.timeline{gap:8px}.old .layout{flex-wrap:wrap}.old .identity{width:auto}.old .playback{width:130px}.old .actions{margin-left:auto}}
</style>
<div id="review"><strong>Spotify deck · Interactive mock</strong><span>Simulated music</span><button id="current" aria-pressed="false">Current</button><button id="proposed" aria-pressed="true">Proposed</button><button id="narrow" aria-pressed="false">Narrow view</button></div>
<main id="frame"><div class="room"><div><small>THE WAREHOUSE · ROOM 01</small><h1>Your agents. Off the clock.</h1><p>A focused preview of the Spotify bar.</p></div><span class="neon" aria-hidden="true">RAVE</span></div><div class="deck"><div class="layout"><div class="identity"><div class="art" aria-hidden="true"><div class="vinyl"></div></div><div class="meta"><span class="label"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10" opacity=".2"/><path d="M6 9c4-2 8-1 12 1M7 12c3-1 6-1 10 1M8 15c2-1 5-1 8 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>ON THE DECKS</span><strong class="title">MOAA</strong><span class="artist">Pegassi</span></div></div><div class="playback"><div class="transport"><button class="icon previous" aria-label="Previous track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm12 0v14L8 12z"/></svg></button><button class="icon play" aria-label="Pause Spotify"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg></button><button class="icon next" aria-label="Next track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM6 5v14l10-7z"/></svg></button></div><div class="timeline"><span>1:02</span><div class="rail"><i></i></div><span>3:53</span></div></div><div class="actions"><span class="connection"><i></i>Spotify connected</span><button class="choose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h12M4 10h9M4 14h6m9-3v8m0-8 3 3m-3-3-3 3"/></svg>Choose music</button><button class="icon disconnect" aria-label="Disconnect Spotify" title="Disconnect controls; music keeps playing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 3v6m6-6v6M6 9h12v2a6 6 0 0 1-6 6v4m0-4a6 6 0 0 1-6-6Z"/></svg></button></div></div><form class="picker" hidden><label>Spotify track, album, or playlist<input aria-label="Spotify link" placeholder="https://open.spotify.com/playlist/…" required></label><button>Play</button></form></div><p class="note">Try play/pause, next track, Choose music, and the narrow layout. Playback is simulated.</p></main>
<script>
const $=s=>document.querySelector(s);let playing=true;for(const id of ['current','proposed'])$('#'+id).onclick=()=>{document.body.classList.toggle('old',id==='current');for(const value of ['current','proposed'])$('#'+value).setAttribute('aria-pressed',String(id===value))};$('#narrow').onclick=()=>{const narrow=$('#narrow').getAttribute('aria-pressed')!=='true';$('#narrow').setAttribute('aria-pressed',String(narrow));$('#frame').style.width=narrow?'min(520px,100%)':'100%'};$('.play').onclick=()=>{playing=!playing;$('.play').setAttribute('aria-label',playing?'Pause Spotify':'Play Spotify');$('.play svg').innerHTML=playing?'<path d="M7 5h3v14H7zm7 0h3v14h-3z"/>':'<path d="m8 4 12 8-12 8z"/>'};for(const name of ['next','previous'])$('.'+name).onclick=()=>{$('.title').textContent=name==='next'?'Innerbloom':'MOAA';$('.artist').textContent=name==='next'?'RÜFÜS DU SOL':'Pegassi'};$('.choose').onclick=()=>{$('.picker').hidden=!$('.picker').hidden;if(!$('.picker').hidden)$('input').focus()};$('.picker').onsubmit=e=>{e.preventDefault();$('.title').textContent='Your Spotify selection';$('.artist').textContent='Simulated playback';$('.picker').hidden=true};$('.disconnect').onclick=()=>{$('.connection').textContent='Disconnected';$('.title').textContent='Your Spotify. Our sound system.';$('.artist').textContent='Preview reset on next track'};document.onkeydown=e=>{if(e.key==='Escape'){$('.picker').hidden=true;$('.choose').focus()}};
</script></html>
